<div class="pedidos">
    <ul class="pedidos_list">
        <li class="pedidos_list_card" *ngFor="let order of ordersList; let i = index">

            <div class="pedidos_list_card_icon">
                <lucide-icon name="shopping-cart" size="32" color="#34b35a"  [strokeWidth]="1.25"></lucide-icon>
            </div>

            <div class="pedidos_list_card_content">
                <div class="pedidos_list_card_content_details">
                    <div class="pedidos_list_card_content_details_title">Pedido Nº #{{i + 1}}</div> <!--Posteriormernte trocar por numero gerado no pedido (aleatorio padronizado) -->
                    <div class="pedidos_list_card_content_details_label">Total: <b>R$ 40,00</b> </div>
                    <div class="pedidos_list_card_content_details_clock">
                        <lucide-icon name="calendar-clock" size="18" color="#777"></lucide-icon>
                        <span class="pedidos_list_card_content_details_clock_label">29/04 às 20h</span>
                    </div>
                </div>

                <div class="pedidos_list_card_content_status">
                    <div class="pedidos_list_card_content_status_icon"></div>
                    <div class="pedidos_list_card_content_status_label">Em andamento</div>
                </div>
            </div>
        </li>
    </ul>
</div>
