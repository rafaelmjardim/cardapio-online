<div class="pedidos">
    <ul class="pedidos_list">
        <li class="pedidos_list_card" *ngFor="let order of ordersList">

            <div class="pedidos_list_card_icon">
                <lucide-icon name="shopping-cart" size="32" color="#34b35a"  [strokeWidth]="1.25"></lucide-icon>
            </div>

            <div class="pedidos_list_card_content">
                <div class="pedidos_list_card_content_title">{{order.name}}</div>
                <div class="pedidos_list_card_content_label">Total: <b>R$ 40,00</b> </div>
                <div class="pedidos_list_card_content_label">29/04 às 20h</div>

            </div>
        </li>
    </ul>
</div>
