<div class="confirmation_dialog">
    <div class="confirmation_dialog_main">

        <lucide-icon name="check-circle" size="90" color="#34b35a"></lucide-icon>

        <span>Recebemos seu pedido, estamos preparando tudo para você</span>

        <div class="confirmation_dialog_main_actions">
            <button class="confirmation_dialog_main_actions_button" (click)="handleOpenOrders()">Acompanhar pedido</button>
            <span class="confirmation_dialog_main_actions_return" (click)="handleReturnToBuy()">Continuar comprando</span>
        </div>
    </div>
</div>
