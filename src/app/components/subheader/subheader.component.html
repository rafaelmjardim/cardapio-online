<div class="subheader">
    <div class="subheader_logo">
        <img src="assets/burger9_01.jpg" alt="Logo da marca">
    </div>

    <div class="subheader_group">
        <div class="subheader_group_content">
            <h1 class="subheader_group_content_title">Nome da marca</h1>
            <span class="subheader_group_content_txt">
                <span class="subheader_group_content_txt_status">Aberto</span>
                <span (click)="handleOpenInfoDialog()"> > Mais informações</span>
            </span>
        </div>
        
        <div class="subheader_group_menuMobile">
            <i-lucide name="menu" class="subheader_group_menuMobile_icon"></i-lucide>
        </div>
        <ul class="subheader_group_menu" *ngIf="!mobile_utils.mediaMobile">
            <li class="subheader_group_menu_button" [ngClass]="router.url === '/home' || router.url === '/' ? 'clicked' : '' " routerLink="/home">
                <lucide-icon name="home" class="icon" [size]="20"></lucide-icon>
                Início
            </li>

            <li class="subheader_group_menu_button" [ngClass]="router.url === '/promocoes' ? 'clicked' : '' " routerLink="/promocoes">
                <lucide-icon name="badge-percent" [size]="20"></lucide-icon>
                Promoções
            </li>

            <li class="subheader_group_menu_button" [ngClass]="router.url === '/pedidos' ? 'clicked' : '' " routerLink="/pedidos">
                <lucide-icon name="shopping-bag" [size]="20"></lucide-icon>
                Pedidos
            </li>

            <li class="subheader_group_menu_button" [ngClass]="router.url === '/user' ? 'clicked' : '' " (click)="!isLogged ? handleOpenLoginDialog() : handleLogout()">
                <lucide-icon [name]="isLogged ? 'log-out' : 'user'" [size]="20"></lucide-icon>
                <span>{{isLogged ? 'Sair' : 'Entrar'}}</span>
            </li>            
        </ul>
    </div>
        
        
</div>
