<div class="product-dialog" *ngIf="currentProduct">
    <div class="product-dialog__header">
        <div class="product-dialog__bag">
            <lucide-icon name="shopping-bag" [size]="20"></lucide-icon>
        </div>

        <div class="product-dialog__close" (click)="dialog.closeAll()">
            <lucide-icon name="x" [size]="20"></lucide-icon>
        </div>
    </div>
    
    <!-- Imagem do produto -->
    <div class="product-dialog__ilustration" [ngStyle]="{'background-image': 'url(' + currentProduct.imagem +')'}"></div>

    <div class="product-dialog__main">
        <div class="product-dialog__content">
            <span class="product-dialog__title">{{ currentProduct.nome }}</span>
            <p class="product-dialog__description">{{ currentProduct.descricao}}</p>
        </div>

        <ul class="product-dialog__add scroll" *ngIf="currentProduct.id_categoria !== 3">

            <!-- ADICIONAIS -->
            <li class="product-dialog__item" *ngFor="let adicional of adicionaisList">
                <div class="product-dialog__group">
                    <span class="product-dialog_main___group-title">
                        {{adicional.nome}}
                    </span>
                    <span class="product-dialog__group-value">
                        + {{adicional.valor_venda | currency:"BRL"}}
                    </span>
                </div>

                <div class="product-dialog__action">
                    <button (click)="handleCountAdicional('minus', adicional)" [ngClass]="{'product-dialog__actions--disable': adicional.quantidade <= 0}">
                        <lucide-icon name="minus" [size]="16"></lucide-icon>
                    </button>

                    <span class="product-dialog__action-value">
                        <span> {{ adicional.quantidade }}</span>
                    </span>
                    
                    <button (click)="handleCountAdicional('plus', adicional)">
                        <lucide-icon name="plus" [size]="16"></lucide-icon>
                    </button>
                </div>
            </li>
            <!-- FIM ADICIONAIS -->
        </ul>

        <div class="product-dialog__actions">
            <div class="product-dialog__selector">
                <button class="product-dialog__less" [ngClass]="countProduct < 1 ? 'product-dialog__selector--disable' : '' " (click)="handleCountProducts('less')">
                    <lucide-icon name="minus" [size]="20"></lucide-icon>
                </button>

                <div class="product-dialog__selector-value">
                    {{countProduct}}
                </div>
                
                <button class="product-dialog__more" (click)="handleCountProducts('plus')">
                    <lucide-icon name="plus"  [size]="20"></lucide-icon>
                </button>
                
                <div class="product-dialog__quantity">    
                    <span class="product-dialog__quantity-value"> 
                       {{countProduct * currentProduct.valor_venda | currency:'BRL' }}
                    </span>
                </div>
            </div>

            <button class="product-dialog__button button-primary" (click)="!isEdit ? handleAddCart(currentProduct) : handleEditCart()">{{!isEdit ? 'Adicionar' : 'Editar'}}</button>
        </div>
    </div>
</div>
